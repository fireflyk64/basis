[package]
name = "basis_network_server"
description = "Port of BasisNetworkServer: the Basis relay server."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Seams that exist for the test suites and must not be reachable from a shipped server. The
# auth-identity one installs an authenticated entry without the challenge round trip, so it is
# the difference between a test double and an authentication bypass.
#
# Cargo unifies features across a workspace build, so `cargo build --workspace` (which also
# builds the test crates) does enable this. The shipping path — `cargo build --release -p
# basis_network_console` — does not, and that is the build the guarantee is about.
test-seams = []

[dependencies]
basis_network_core = { path = "../basis_network_core" }
basis_error = { workspace = true, features = ["tokio"] }
basis_network_compute = { path = "../basis_network_compute" }
basis_did = { path = "../contrib/did" }
basis_crypto = { path = "../contrib/crypto" }
iroh.workspace = true
iroh-base.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
hyper.workspace = true
bytes.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
crossbeam-channel.workspace = true
crossbeam-queue.workspace = true
rayon.workspace = true
fearless_simd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
quick-xml.workspace = true
zstd.workspace = true
lz4_flex.workspace = true
half.workspace = true
uuid.workspace = true
base64.workspace = true
unicode-segmentation.workspace = true
regex.workspace = true
rand.workspace = true
thiserror.workspace = true
num_cpus.workspace = true
libc.workspace = true
sysinfo.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
serial_test.workspace = true
tempfile.workspace = true
