[package]
name = "basis_network_console"
description = "Port of BasisServerConsole: the server executable, console and setup wizard."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
basis_network_server = { path = "../basis_network_server" }
basis_network_core = { path = "../basis_network_core" }
basis_network_compute = { path = "../basis_network_compute" }
basis_error = { path = "../basis_error" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml.workspace = true
parking_lot.workspace = true
num_cpus.workspace = true
libc.workspace = true
sysinfo.workspace = true
pprof = { version = "0.15.0", features = ["flamegraph"], optional = true }
# Measured, not assumed: 7 paired 200-player runs put mimalloc 3.7 % below glibc in
# server CPU per packet on the iroh path (jemalloc was worse on both). See irohplan.md item 1.
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[features]
# Build with --no-default-features to fall back to the system allocator, which is what
# heaptrack, valgrind and ASAN want to see.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
pprof = ["dep:pprof"]
